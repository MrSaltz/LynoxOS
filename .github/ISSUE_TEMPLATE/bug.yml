name: Documentation / demo issue
description: Something in the docs, changelog, or a demo doesn't match, is broken, or is unclear.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        This repository doesn't contain the Lynox kernel source, so this
        isn't for a bug in the running system's code — it's for problems
        with what's published *here*: a broken link, a claim in the docs
        that contradicts the changelog, a screenshot/demo that doesn't
        match its description, or similar.
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: Point to the specific file/section if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would you expect instead?
    validations:
      required: false
